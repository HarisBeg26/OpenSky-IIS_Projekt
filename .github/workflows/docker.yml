name: Build and deploy Docker image

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - Fetch data on schedule
    types:
      - completed

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/harisbeg26/opensky-iis-projekt

jobs:
  docker:
    name: Build and publish SkyWatch services
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install project dependencies
        run: uv sync --python 3.11 --locked

      - name: DVC setup remote
        env:
          DAGSHUB_S3_ENDPOINT_URL: ${{ vars.DAGSHUB_S3_ENDPOINT_URL }}
          DAGSHUB_ACCESS_KEY_ID: ${{ secrets.DAGSHUB_ACCESS_KEY_ID }}
          DAGSHUB_SECRET_ACCESS_KEY: ${{ secrets.DAGSHUB_SECRET_ACCESS_KEY }}
        run: |
          if [ -n "$DAGSHUB_S3_ENDPOINT_URL" ]; then
            uv run dvc remote add -d origin s3://dvc --force
            uv run dvc remote modify origin endpointurl "$DAGSHUB_S3_ENDPOINT_URL"
            uv run dvc remote modify origin --local access_key_id "$DAGSHUB_ACCESS_KEY_ID"
            uv run dvc remote modify origin --local secret_access_key "$DAGSHUB_SECRET_ACCESS_KEY"
            uv run dvc pull --allow-missing --force
          else
            echo "DAGSHUB_S3_ENDPOINT_URL is not set. Building image without DVC artifacts."
          fi

      - name: Verify production artifacts
        run: |
          test -f models/opensky/trajectory_lstm.keras
          test -f models/opensky/trajectory_lstm.onnx
          test -f models/opensky/on_ground_lstm.keras
          test -f models/opensky/on_ground_lstm.onnx
          test -f models/opensky/preprocessors.pkl
          test -f reports/model_training/opensky_metrics.json
          test -f reports/model_monitoring/production_model_monitoring.json
          test -f data/predictions/latest_predictions.json

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push public API image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:api-latest
            ${{ env.IMAGE_NAME }}:api-${{ github.sha }}
          cache-from: type=gha,scope=skywatch-api
          cache-to: type=gha,mode=max,scope=skywatch-api

      - name: Build and push private model image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/model-service.Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:model-latest
            ${{ env.IMAGE_NAME }}:model-${{ github.sha }}
          cache-from: type=gha,scope=skywatch-model
          cache-to: type=gha,mode=max,scope=skywatch-model

      - name: Trigger Render model deploy
        env:
          RENDER_MODEL_DEPLOY_HOOK_URL: ${{ secrets.RENDER_MODEL_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_MODEL_DEPLOY_HOOK_URL" ]; then
            echo "RENDER_MODEL_DEPLOY_HOOK_URL is not configured. Model image was published to GHCR only."
            exit 0
          fi
          curl -fsS -X POST "$RENDER_MODEL_DEPLOY_HOOK_URL"

      - name: Trigger Render API deploy
        env:
          RENDER_API_DEPLOY_HOOK_URL: ${{ secrets.RENDER_API_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_API_DEPLOY_HOOK_URL" ]; then
            echo "RENDER_API_DEPLOY_HOOK_URL is not configured. API image was published to GHCR only."
            exit 0
          fi
          curl -fsS -X POST "$RENDER_API_DEPLOY_HOOK_URL"
