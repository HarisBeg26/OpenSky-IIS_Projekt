name: Fetch data on schedule

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: write

jobs:
  fetch_opensky:
    name: Fetch and pre-process OpenSky data
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN || github.token }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Refresh uv lock for Python 3.11
        run: uv lock --python 3.11

      - name: Install dependencies
        run: uv sync --python 3.11 --locked

      - name: Setup Git
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"

      - name: DVC setup remote
        env:
          DAGSHUB_S3_ENDPOINT_URL: ${{ vars.DAGSHUB_S3_ENDPOINT_URL }}
          DAGSHUB_ACCESS_KEY_ID: ${{ secrets.DAGSHUB_ACCESS_KEY_ID }}
          DAGSHUB_SECRET_ACCESS_KEY: ${{ secrets.DAGSHUB_SECRET_ACCESS_KEY }}
        run: |
          if [ -n "$DAGSHUB_S3_ENDPOINT_URL" ]; then
            uv run dvc remote add -d origin s3://dvc --force
            uv run dvc remote modify origin endpointurl "$DAGSHUB_S3_ENDPOINT_URL"
            uv run dvc remote modify origin --local access_key_id "$DAGSHUB_ACCESS_KEY_ID"
            uv run dvc remote modify origin --local secret_access_key "$DAGSHUB_SECRET_ACCESS_KEY"
          else
            echo "DAGSHUB_S3_ENDPOINT_URL is not set. Skipping remote setup."
          fi

      - name: Run DVC pipeline
        env:
          OPENSKY_USERNAME: ${{ secrets.OPENSKY_USERNAME }}
          OPENSKY_PASSWORD: ${{ secrets.OPENSKY_PASSWORD }}
          OPENSKY_URL: ${{ vars.OPENSKY_URL }}
          DAGSHUB_S3_ENDPOINT_URL: ${{ vars.DAGSHUB_S3_ENDPOINT_URL }}
          DAGSHUB_ACCESS_KEY_ID: ${{ secrets.DAGSHUB_ACCESS_KEY_ID }}
          DAGSHUB_SECRET_ACCESS_KEY: ${{ secrets.DAGSHUB_SECRET_ACCESS_KEY }}
          MLFLOW_TRACKING_USERNAME: ${{ secrets.MLFLOW_TRACKING_USERNAME }}
          MLFLOW_TRACKING_PASSWORD: ${{ secrets.MLFLOW_TRACKING_PASSWORD }}
        run: |
          uv run dvc pull --allow-missing --force
          uv run dvc status
          uv run dvc repro
          uv run dvc push
          git add dvc.lock uv.lock
          for metric in \
            reports/validation/opensky_validation.json \
            reports/model_training/opensky_metrics.json \
            reports/model_monitoring/production_model_monitoring.json; do
            if [ -f "$metric" ]; then
              git add -f "$metric"
            fi
          done
          find models reports -name .gitignore -print -exec git add {} \; || true
          git commit -m "Update pipeline lock files on `date` with GitHub Actions" || true

      - name: Push changes
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.PAT_TOKEN }}

      - name: Setup Node for Netlify deploy
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Deploy Great Expectations Data Docs to Netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          if [ -z "$NETLIFY_AUTH_TOKEN" ] || [ -z "$NETLIFY_SITE_ID" ]; then
            echo "Netlify secrets are not configured. Skipping deploy."
            exit 0
          fi
          test -f gx/uncommitted/data_docs/local_site/index.html
          npx netlify-cli deploy --dir=gx/uncommitted/data_docs/local_site --prod --message "OpenSky Great Expectations Data Docs"
