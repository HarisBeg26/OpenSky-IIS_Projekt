stages:
  fetch:
    cmd: uv run python main.py ingest
    deps:
      - main.py
      - src/data/fetch_opensky_data.py
      - params.yaml
    params:
      - fetch.url
      - fetch.output_dir
      - fetch.timeout_seconds
      - fetch.bbox
    outs:
      - data/raw:
          persist: true
    always_changed: true

  preprocess:
    cmd: uv run python main.py preprocess
    deps:
      - main.py
      - src/data/preprocess_opensky_data.py
      - data/raw
      - params.yaml
    params:
      - preprocess.raw_dir
      - preprocess.output_dir
      - preprocess.format
      - preprocess.history_filename
    outs:
      - data/processed:
          persist: true

  validate:
    cmd: uv run python gx/run_checkpoint.py
    deps:
      - gx/run_checkpoint.py
      - src/data/validate_opensky_data.py
      - data/processed
      - params.yaml
    params:
      - validate.processed_dir
      - validate.history_file
      - validate.report_path
      - validate.gx_dir
      - validate.datasource_name
      - validate.data_asset_name
      - validate.expectation_suite_name
      - validate.checkpoint_name
      - validate.docs_site_name
    outs:
      - gx/uncommitted:
          persist: true
    metrics:
      - reports/validation/opensky_validation.json

  test_data:
    cmd: uv run python src/data/test_opensky_data.py
    deps:
      - src/data/test_opensky_data.py
      - data/processed
      - params.yaml
    params:
      - test_data.processed_dir
      - test_data.reference_dir
      - test_data.reference_file
      - test_data.report_html
      - test_data.report_json
      - test_data.drop_columns
    outs:
      - data/reference:
          persist: true
      - reports/evidently:
          persist: true
