stages:
  fetch:
    cmd: uv run python main.py ingest
    deps:
      - main.py
      - src/data/fetch_opensky_data.py
      - params.yaml
    params:
      - fetch.url
      - fetch.output_dir
      - fetch.timeout_seconds
      - fetch.retries
      - fetch.retry_backoff_seconds
      - fetch.allow_cached_on_failure
      - fetch.max_cached_age_hours
      - fetch.bbox
    outs:
      - data/raw:
          persist: true
    always_changed: true

  preprocess:
    cmd: uv run python main.py preprocess
    deps:
      - main.py
      - src/data/preprocess_opensky_data.py
      - data/raw
      - params.yaml
    params:
      - preprocess.raw_dir
      - preprocess.output_dir
      - preprocess.format
      - preprocess.history_filename
    outs:
      - data/processed:
          persist: true

  validate:
    cmd: uv run python gx/run_checkpoint.py
    deps:
      - gx/run_checkpoint.py
      - src/data/validate_opensky_data.py
      - data/processed
      - params.yaml
    params:
      - validate.processed_dir
      - validate.history_file
      - validate.report_path
      - validate.gx_dir
      - validate.datasource_name
      - validate.data_asset_name
      - validate.expectation_suite_name
      - validate.checkpoint_name
      - validate.docs_site_name
    outs:
      - gx/uncommitted:
          persist: true
    metrics:
      - reports/validation/opensky_validation.json

  test_data:
    cmd: uv run python src/data/test_opensky_data.py
    deps:
      - src/data/test_opensky_data.py
      - data/processed
      - params.yaml
    params:
      - test_data.processed_dir
      - test_data.reference_dir
      - test_data.reference_file
      - test_data.report_html
      - test_data.report_json
      - test_data.min_rows
      - test_data.drift_share
      - test_data.max_reference_current_row_ratio
      - test_data.drop_columns
    outs:
      - data/reference:
          persist: true
      - reports/evidently:
          persist: true

  train:
    cmd: uv run python main.py train
    deps:
      - main.py
      - src/model/compression.py
      - src/model/explainability.py
      - src/model/mlflow_tracking.py
      - src/model/preprocess.py
      - src/model/train.py
      - src/model/training_artifacts.py
      - src/model/training_config.py
      - src/model/training_metrics.py
      - src/model/training_models.py
      - src/model/training_report.py
      - data/processed
      - gx/uncommitted
      - reports/validation/opensky_validation.json
      - data/reference
      - reports/evidently/opensky_data_drift_summary.json
      - params.yaml
    params:
      - train.history_file
      - train.models_dir
      - train.metrics_path
      - train.compression_report_path
      - train.explainability_report_path
      - train.mlflow_tracking_uri
      - train.mlflow_experiment_name
      - train.mlflow_mode
      - train.register_models
      - train.local_mlflow_fallback
      - train.require_remote_mlflow
      - train.trajectory_registered_model_name
      - train.on_ground_registered_model_name
      - train.await_model_registration_seconds
      - train.compression_enabled
      - train.compression_method
      - train.quantization_dtype
      - train.explainability_enabled
      - train.explainability_sample_size
      - train.explainability_repeats
      - train.explainability_top_n
      - train.test_size
      - train.max_sequences
      - train.window_size
      - train.max_sequence_gap_seconds
      - train.trajectory_target_mode
      - train.random_state
      - train.lstm_units
      - train.dense_units
      - train.dropout
      - train.epochs
      - train.batch_size
      - train.validation_split
      - train.patience
      - train.onnx_opset
      - train.feature_columns
    outs:
      - models/opensky:
          persist: true
    metrics:
      - reports/model_training/opensky_metrics.json
      - reports/model_compression/opensky_compression.json
      - reports/model_explainability/opensky_explainability.json

  batch_predict:
    cmd: uv run python main.py predict-batch
    deps:
      - main.py
      - src/inference/batch.py
      - src/inference/data.py
      - src/inference/onnx.py
      - data/processed
      - models/opensky
      - params.yaml
    params:
      - batch_prediction.processed_dir
      - batch_prediction.output_file
      - batch_prediction.max_aircraft
    outs:
      - data/predictions:
          persist: true

  monitor:
    cmd: uv run python main.py monitor
    deps:
      - main.py
      - src/monitoring/monitor_models.py
      - data/processed
      - models/opensky
      - reports/model_training/opensky_metrics.json
      - reports/model_compression/opensky_compression.json
      - reports/model_explainability/opensky_explainability.json
      - data/predictions
      - params.yaml
    params:
      - monitoring.report_path
      - monitoring.processed_dir
      - monitoring.models_dir
      - monitoring.training_metrics
      - monitoring.compression_report
      - monitoring.explainability_report
      - monitoring.deployment_report_path
      - monitoring.batch_predictions
      - monitoring.max_trajectory_mae
      - monitoring.max_trajectory_mean_distance_km
      - monitoring.min_trajectory_skill_score
      - monitoring.min_on_ground_accuracy
      - monitoring.min_on_ground_f1
      - monitoring.max_data_age_hours
    metrics:
      - reports/model_monitoring/production_model_monitoring.json
      - reports/deployment/model_deployment_patterns.json
