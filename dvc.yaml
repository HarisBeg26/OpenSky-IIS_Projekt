stages:
  fetch:
    cmd: uv run python main.py ingest
    deps:
      - main.py
      - src/data/fetch_opensky_data.py
      - params.yaml
    params:
      - fetch.url
      - fetch.output_dir
    outs:
      - data/raw:
          persist: true
    always_changed: true

  preprocess:
    cmd: uv run python main.py preprocess
    deps:
      - main.py
      - src/data/preprocess_opensky_data.py
      - data/raw
      - params.yaml
    params:
      - preprocess.raw_dir
      - preprocess.output_dir
      - preprocess.format
    outs:
      - data/processed:
          persist: true

  validate:
    cmd: uv run python main.py validate
    deps:
      - main.py
      - src/data/validate_opensky_data.py
      - data/processed
      - params.yaml
    params:
      - validate.processed_dir
