services:
  model-service:
    build:
      context: .
      dockerfile: docker/model-service.Dockerfile
    environment:
      MODEL_SERVICE_TOKEN: local-skywatch-token
      PORT: "8001"
    ports:
      - "8001:8001"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health')"
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      MODEL_SERVICE_URL: http://model-service:8001
      MODEL_SERVICE_TOKEN: local-skywatch-token
      ALLOW_LOCAL_MODEL_FALLBACK: "false"
      PORT: "8000"
    ports:
      - "8000:8000"
    depends_on:
      model-service:
        condition: service_healthy
